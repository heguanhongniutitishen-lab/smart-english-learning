name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sel
          POSTGRES_PASSWORD: sel
          POSTGRES_DB: sel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sel -d sel_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://sel:sel@localhost:5432/sel_test
      TEST_DATABASE_URL: postgresql://sel:sel@localhost:5432/sel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node apps/api/scripts/migrate.js
      - run: npm test --workspace=@sel/api
      - run: node --check apps/api/src/app.js
      - run: node --check apps/api/src/server.js
